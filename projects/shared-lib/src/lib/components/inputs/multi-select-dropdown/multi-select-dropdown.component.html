<div [formGroup]="inputFormGroup" class="field-shell" [ngClass]="customClasses">
  <label class="form-label" [for]="id" [ngClass]="{ 'd-flex flex-column': !isHorizontal }">
    <span *ngIf="!faIcon">{{ label | translate }}</span>
    <i *ngIf="faIcon" class="fa me-2" [ngClass]="faIcon" aria-hidden="true"></i>
  </label>

  <div class="multi-select-wrapper">
    <div class="multi-select-toolbar" *ngIf="showSelectAll">
      <button type="button" class="btn btn-link btn-sm p-0" (click)="toggleAll(true)">
        {{ 'common.selectAll' | translate }}
      </button>
      <button type="button" class="btn btn-link btn-sm p-0" (click)="clearSelection()">
        {{ 'common.clear' | translate }}
      </button>
    </div>

    <select
      [id]="id"
      [attr.aria-label]="ariaLabel || label || 'Multi-select dropdown'"
      [attr.aria-describedby]="describedByIds"
      [size]="size"
      class="form-select"
      [class.is-invalid]="controlIsInvalid"
      [disabled]="disabled"
      [formControlName]="controlName"
      multiple
    >
      <option *ngFor="let option of options" [value]="option.value">
        {{ option.label | translate }}
      </option>
    </select>
  </div>

  <small *ngIf="helpText" class="form-text text-body-secondary" [id]="id + '-help'">
    {{ helpText | translate }}
  </small>

  <div *ngIf="errorMessageList.length" class="invalid-feedback d-block" [id]="id + '-errors'">
    <div *ngFor="let message of errorMessageList">
      {{ message | translate }}
    </div>
  </div>
</div>
