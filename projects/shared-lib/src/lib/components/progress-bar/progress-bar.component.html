
@let style = verticalMode() ? {height: cssLength(barLength), width: cssLength(barWidth)} : {height: cssLength(barWidth), width: cssLength(barLength)};
@let class = verticalMode() ? 'd-flex bar-container flex-column justify-content-end':'';
<div
  class="bar-container"
  [ngClass]="class"
  role="progressbar"
  [attr.aria-label]="ariaLabel"
  [attr.aria-valuemin]="0"
  [attr.aria-valuemax]="total"
  [attr.aria-valuenow]="progressValue"
  [attr.aria-valuetext]="progressValue + '% complete'"
  [ngStyle]="style"
>
  @if(verticalMode()){
    <div class="inner-bar-v w-100" [class.two-way]="twoWay" [ngClass]="bgClass" [ngStyle]="{height: remainingPct+'%'}"></div>
  }@else{
    <div class="inner-bar-h h-100" [class.two-way]="twoWay" [ngClass]="bgClass" [ngStyle]="{width: remainingPct+'%'}"></div>
  }
</div>
