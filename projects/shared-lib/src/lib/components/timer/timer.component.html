<div class="timer-label" *ngIf="label" [attr.aria-live]="'polite'">{{ label }}</div>
<p class="timer-value" *ngIf="timeLeft > 0" role="timer" [attr.aria-label]="formattedLabel" [attr.aria-live]="'polite'">{{ timeLeft | formatTime }}</p>
<div class="timer-message" *ngIf="messageToShow && timeLeft<=0" role="status" [attr.aria-live]="'polite'">{{ messageToShow }}</div>
