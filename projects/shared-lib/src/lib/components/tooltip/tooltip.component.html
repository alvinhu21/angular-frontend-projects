<div class="tooltip-container" [ngClass]="{'dotted-underline': !faIcon}" tabindex="0" [attr.aria-label]="tooltipLabel | translate" [attr.aria-describedby]="tooltipText ? 'tooltip-' + tooltipLabel : null">
  <span *ngIf="faIcon" class="tooltip-icon" [ngClass]="'fa fa-'+faIcon" aria-hidden="true"></span>
  <span class="label-text" [ngClass]="{'visually-hidden': faIcon}">{{ tooltipLabel | translate }}</span>
  <span class="tooltip-box" [id]="'tooltip-' + tooltipLabel" [ngClass]="'tooltip-box-'+tooltipDirection" role="tooltip">{{ tooltipText | translate }}</span>
</div>
