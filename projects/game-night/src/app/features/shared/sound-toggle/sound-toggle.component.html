<button
  type="button"
  class="sound-toggle"
  [attr.aria-pressed]="audio.enabled()"
  [attr.title]="'common.soundEffects' | translate"
  (click)="audio.toggle()"
>
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
    @if (audio.enabled()) {
      <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    } @else {
      <path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    }
  </svg>
  <span class="visually-hidden">{{ 'common.soundEffects' | translate }}</span>
</button>
