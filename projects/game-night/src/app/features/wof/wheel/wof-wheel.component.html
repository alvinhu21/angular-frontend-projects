<figure class="wheel" [class.wheel--moving]="status() !== 'STOPPED'" [class.wheel--landed]="revealedResult() !== null">
  <div class="wheel__stage" role="img" [attr.aria-label]="ariaText().key | translate: ariaText().params">
    <div class="wheel__rim" aria-hidden="true"></div>

    <svg class="wheel__lights" viewBox="0 0 1000 1000" aria-hidden="true" focusable="false">
      @for (bulb of bulbs; track $index) {
        <circle class="wheel__bulb-glow" [attr.cx]="bulb.x" [attr.cy]="bulb.y" r="15" [style.animation-delay]="bulb.delay" />
        <circle class="wheel__bulb" [attr.cx]="bulb.x" [attr.cy]="bulb.y" r="8" [style.animation-delay]="bulb.delay" />
      }
    </svg>

    <!-- The only layer that turns. Its viewBox is the face's bounding box in the shared 1000-unit space. -->
    <svg #rotor class="wheel__rotor" viewBox="55 55 890 890" aria-hidden="true" focusable="false">
      @for (face of faces(); track face.key) {
        <path class="wheel__wedge" [attr.d]="face.path" [attr.fill]="face.fill" />
      }
      @for (face of faces(); track face.key) {
        <g class="wheel__label" [attr.transform]="face.rotate" [attr.fill]="face.ink">
          @for (glint of face.sparkles; track $index) {
            <circle fill="#fff" opacity="0.75" [attr.cx]="glint.x" [attr.cy]="glint.y" [attr.r]="glint.r" />
          }
          @if (face.card; as card) {
            <rect class="wheel__card" rx="7" [attr.x]="card.x" [attr.y]="card.y" [attr.width]="card.width" [attr.height]="card.height" />
            @for (glyph of card.glyphs; track $index) {
              <text [attr.x]="500" [attr.y]="glyph.y" [attr.font-size]="glyph.size" [attr.fill]="glyph.fill">{{ glyph.char }}</text>
            }
          }
          @if (face.stack; as stack) {
            @for (glyph of stack; track $index) {
              <text [attr.x]="500" [attr.y]="glyph.y" [attr.font-size]="glyph.size">{{ glyph.char }}</text>
            }
          }
          @if (face.radial; as radial) {
            <text [attr.x]="500" [attr.y]="radial.y" [attr.font-size]="radial.size" [attr.transform]="radial.transform">{{ radial.text }}</text>
          }
        </g>
      }
      <g stroke="rgb(12 13 20 / 0.6)" stroke-width="3.5">
        @for (edge of boundaries(); track $index) {
          <line [attr.x1]="edge.inner.x" [attr.y1]="edge.inner.y" [attr.x2]="edge.outer.x" [attr.y2]="edge.outer.y" />
        }
      </g>
      <circle cx="500" cy="500" r="445" fill="none" stroke="#0e1018" stroke-width="7" />
      @for (edge of boundaries(); track $index) {
        <circle class="wheel__peg" fill="#eef0f7" stroke="#2c3044" stroke-width="2.5" [attr.cx]="edge.peg.x" [attr.cy]="edge.peg.y" r="7.5" />
        <circle fill="#fff" [attr.cx]="edge.peg.x - 2" [attr.cy]="edge.peg.y - 2" r="2.4" />
      }
    </svg>

    <div class="wheel__sheen" aria-hidden="true"></div>

    <div class="wheel__hub" aria-hidden="true">
      <svg viewBox="-50 -50 100 100" focusable="false">
        <circle r="40" fill="none" stroke="rgb(90 58 0 / 0.55)" stroke-width="2" />
        <polygon
          fill="#11162e"
          stroke="#fff1b8"
          stroke-width="1.6"
          stroke-linejoin="round"
          points="0,-30 7.05,-9.7 28.53,-9.27 11.41,3.71 17.63,24.27 0,12 -17.63,24.27 -11.41,3.71 -28.53,-9.27 -7.05,-9.7"
        />
      </svg>
    </div>

    <!-- Pivot near the top; the blade reaches down past the peg ring so every peg has to shove it aside. -->
    <svg #flapper class="wheel__flapper" viewBox="0 0 80 100" aria-hidden="true" focusable="false">
      <!-- Two gold facets (lit / shaded) give the blade a bevel without gradients. -->
      <polygon fill="#fff1b8" points="21,16 40,16 40,86" />
      <polygon fill="#c98a00" points="40,16 59,16 40,86" />
      <polygon fill="none" stroke="#4d3200" stroke-width="2.5" stroke-linejoin="round" points="21,16 59,16 40,86" />
      <circle fill="#1b1d29" stroke="#ffd23f" stroke-width="3" cx="40" cy="16" r="12.5" />
      <circle fill="#ffd23f" cx="40" cy="16" r="4.5" />
    </svg>
  </div>

  <!-- Space is always reserved, so the result appearing never shifts the page. -->
  <figcaption class="wheel__callout-slot">
    @if (revealedWedge(); as landed) {
      <span
        class="wheel__callout"
        [class.wheel__callout--bankrupt]="revealedType() === 'BANKRUPT'"
        [class.wheel__callout--special]="revealedType() === 'WILD_CARD' || revealedType() === 'MILLION'"
        [style.background-color]="landed.backgroundColor"
        [style.color]="landed.textColor"
      >
        {{ landed.label }}
      </span>
    }
  </figcaption>
</figure>
